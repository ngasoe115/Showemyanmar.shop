server {
    listen 80;
    server_name showemyanmar.shop www.showemyanmar.shop;

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name showemyanmar.shop www.showemyanmar.shop;

    # SSL Certificates managed by Certbot
    ssl_certificate /etc/letsencrypt/live/showemyanmar.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/showemyanmar.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Frontend compiled React static assets
    location / {
        root /var/www/showemyanmar/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Express Backend API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
